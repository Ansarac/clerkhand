# Local guard only; CI is authoritative. Nothing is auto-fixed.
# Install with: pnpm exec lefthook install
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: typecheck
      glob: "*.{ts,json}"
      run: pnpm exec tsc -b
